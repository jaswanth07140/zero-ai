name: brain-check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint the brain
        run: python3 runtime/brain.py lint

      - name: Coverage and budget report
        run: python3 runtime/brain.py stats --verbose

      - name: Build the prompt (no network, structure only)
        run: python3 runtime/brain.py build --out prompt.txt --skills

      - name: Evals are structurally valid
        run: python3 runtime/run_eval.py --dry-run
